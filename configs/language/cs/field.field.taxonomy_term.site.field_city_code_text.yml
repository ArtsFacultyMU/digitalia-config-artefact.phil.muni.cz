label: 'Kód obce'
description: 'Kódy obce podle číselníku českých (<a href="https://vdp.cuzk.cz/vdp/ruian/obce/">https://vdp.cuzk.cz/vdp/ruian/obce/</a>) nebo slovenských obcí (<a href="https://www.epi.sk/disk/zz/file/2002/2002c230z0597p01t003ga.pdf">https://www.epi.sk/disk/zz/file/2002/2002c230z0597p01t003ga.pdf</a>; tento údaj je nutné vyplnit pro účely jednoznačné identifikace obce.'
