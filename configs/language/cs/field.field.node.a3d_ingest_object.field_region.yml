description: 'Toto pole se vyplní pouze v případě, že archeologické naleziště nelze přesně lokalizovat (tj. v předchozím poli byla vybrána hodnota „N/A“); zde uveďte alespoň rámcovou charakteristiku místa nálezu (např.: „Slovácko“, „poblíž Moravského Krumlova“,  mezi Vranovicemi a Přísnoticemi“ apod.).'
label: Lokalita
