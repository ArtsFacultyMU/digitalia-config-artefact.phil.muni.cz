      source: field_measurements
      plugin: skip_on_empty
      method: process
    -
      plugin: explode
      delimiter: ' | '
    -
      plugin: str_to_assoc
      key: measurement
  field_measurements:
    -
      plugin: sub_process
      source: '@list_measurements'
      process:
        exploded:
          plugin: explode
          delimiter: ':'
          source: measurement
        dimensions_type:
          -
            plugin: extract
            index:
