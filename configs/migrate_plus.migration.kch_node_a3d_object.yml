uuid: ba37167e-3240-41f3-aee8-303d9ee3a8c5
langcode: en
id: kch_node_a3d_object
migration_group: kch
label: Objects
source:
  plugin: csv
  path: /var/www/html/drupal/web/sites/default/files/data/kch/a3d_object.csv
  delimiter: ','
  header_row_count: 1
  ids:
    - uri
  constants:
    uid: 5
process:
  uid: constants/uid
  title: field_artefact_id
  status:
    -
      plugin: str_replace
      source: is_public
      search: 'yes'
      replace: '1'
    -
      plugin: str_replace
      search: 'no'
      replace: '0'
  field_auth_res_data:
    -
      plugin: default_value
      default_value: 'Irena Loskotová'
    -
      plugin: entity_lookup
      entity_type: taxonomy_term
      value_key: name
      bundle_key: vid
      bundle: author
  field_wgs84_geolocation/lng: field_wgs84_geolocation_long
  field_wgs84_geolocation/lat: field_wgs84_geolocation_lat
  field_artefact_id: field_artefact_id
  field_artefact_id_type:
