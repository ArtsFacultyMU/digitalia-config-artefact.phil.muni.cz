            source: '@exploded'
          -
            plugin: skip_on_empty
            method: process
          -
            plugin: entity_generate
            entity_type: taxonomy_term
            value_key: name
            bundle_key: vid
            bundle: dimensions_qualifier
        shape:
          -
            plugin: extract
            index:
              - 7
            source: '@exploded'
          -
            plugin: skip_on_empty
            method: process
          -
            plugin: entity_generate
            entity_type: taxonomy_term
            value_key: name
            bundle_key: vid
            bundle: shape
        remarks:
          -
            plugin: extract
            index:
              - 9
            source: '@exploded'
          -
            plugin: skip_on_empty
