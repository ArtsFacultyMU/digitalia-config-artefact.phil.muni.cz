      method: process
    -
      plugin: explode
      delimiter: ' | '
    -
      plugin: str_to_assoc
      key: finishing
  field_surface_finishing:
    -
      plugin: sub_process
      source: '@list_surface_finishing'
      process:
        exploded:
          plugin: explode
          delimiter: ':'
          source: finishing
        finishing:
          -
            plugin: extract
            index:
              - 0
            source: '@exploded'
          -
            plugin: skip_on_empty
            method: process
