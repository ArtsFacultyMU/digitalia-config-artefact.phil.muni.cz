      plugin: skip_on_empty
      method: process
      source: field_artefact_id_type
    -
      plugin: migration_lookup
      migration: kch_identifier_type
  field_ownership:
    -
      plugin: migration_lookup
      migration: kch_actor
      source: field_ownership
  field_artefact_category:
    -
      plugin: migration_lookup
      migration: kch_term_artefact_category
