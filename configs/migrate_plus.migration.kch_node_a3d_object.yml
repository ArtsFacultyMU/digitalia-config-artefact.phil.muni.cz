      plugin: explode
      delimiter: ':'
    -
      plugin: extract
      index:
        - 0
  field_number_of_instances/quantity:
    -
      plugin: skip_on_empty
      method: process
      source: field_number_of_instances
    -
      plugin: explode
      delimiter: ':'
    -
      plugin: extract
      index:
